name: CI

# Gate for every PR (PLAN-BACKEND.md §13): typecheck, lint (including the
# three custom rules, each proven by a fixture), unit tests, integration
# tests against a real Postgres (testcontainers), and migration
# up → down → up on a clean database. On merge to main: build and push
# the API image, migrate staging, deploy staging. EAS builds stay manual.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Integration suites hit real Postgres (PLAN-BACKEND.md §14: no
      # mocked database anywhere). T0.2 landed docker-compose.yml and
      # apps/api/test/integration.
      - run: pnpm compose:up
      - run: pnpm test

  migrations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Real up → down → up rehearsal against a clean Postgres 16 —
      # apps/api/src/db/rehearse.ts, driven by tools/migration-check.mjs,
      # which starts the compose db and tears it down afterwards.
      - run: pnpm migration:check

  deploy-staging:
    # On merge to main: build and push the API image, migrate staging,
    # deploy staging. Redacted until T0.16 provisions the VPS.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [typecheck, lint, test, migrations]
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging (pending T0.16 infra)
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          if [ -z "$STAGING_SSH_HOST" ]; then
            echo "Staging deploy is wired but T0.16 has not provisioned the VPS yet; nothing to do."
            exit 0
          fi
          echo "Deploy step placeholder — filled in by T0.16 (environments, backups, alerting)."
