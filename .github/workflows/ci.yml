name: CI

# Gate for every PR (PLAN-BACKEND.md §13): typecheck, lint (including the
# three custom rules, each proven by a fixture), unit tests, integration
# tests against a real Postgres (testcontainers), and migration
# up → down → up on a clean database. On merge to main: build and push
# the API image, migrate staging, deploy staging. EAS builds stay manual.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Integration suites hit real Postgres (PLAN-BACKEND.md §14: no
      # mocked database anywhere). T0.2 landed docker-compose.yml and
      # apps/api/test/integration.
      - run: pnpm compose:up
      - run: pnpm test

  # A Metro bundle is the only thing that proves the app can start.
  # typecheck + vitest both passed for a build that could not resolve
  # expo-notifications — hand-written .d.ts shims satisfied tsc and the
  # test seam aliases the module, so nothing in CI ever asked Metro to
  # resolve a real import. This job asks.
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F mobile bundle:check

  migrations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Real up → down → up rehearsal against a clean Postgres 16 —
      # apps/api/src/db/rehearse.ts, driven by tools/migration-check.mjs,
      # which starts the compose db and tears it down afterwards.
      - run: pnpm migration:check

  deploy-staging:
    # On merge to main: build and push the API image, migrate staging,
    # deploy staging (PLAN-BACKEND.md §13 CI). The VPS half stays a
    # no-op until the owner provisions it and sets the STAGING_SSH_*
    # secrets (docs/implementation/T0.16-RUNBOOK.md); the image
    # pipeline itself is live either way.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [typecheck, lint, test, bundle, migrations]
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy to staging (pending T0.16 VPS)
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          IMAGE: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
        run: |
          if [ -z "$STAGING_SSH_HOST" ]; then
            echo "Staging deploy is wired but the VPS is not provisioned yet (T0.16 runbook); image pushed, nothing deployed."
            exit 0
          fi
          install -m 600 /dev/null ~/deploy_key
          echo "$STAGING_SSH_KEY" > ~/deploy_key
          ssh -i ~/deploy_key -o StrictHostKeyChecking=accept-new \
            "${STAGING_SSH_USER}@${STAGING_SSH_HOST}" \
            "API_IMAGE=$IMAGE bash -s" < ops/deploy-staging.sh
