# ServGrid local stack — the same shape as the one-VPS production deployment
# (PLAN-BACKEND.md §13: Postgres 16, the API, MinIO, Caddy for TLS).
# By default this file provides the data services the host-run API
# (`pnpm -F api dev`, T0.6) and its integration tests stand on —
# `pnpm compose:up` starts db and minio, and /healthz reports on both.
# `docker compose --profile full up -d` additionally runs the API from
# the T0.16 image behind caddy — the same wiring the VPS compose uses.

services:
  db:
    image: postgres:16-alpine
    environment:
      # Local defaults only — production values come from the VPS .env
      # (T0.16), never from this file.
      POSTGRES_USER: servgrid
      POSTGRES_PASSWORD: servgrid
      POSTGRES_DB: servgrid
    ports:
      - '${SERVGRID_DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U servgrid -d servgrid']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: servgrid
      MINIO_ROOT_PASSWORD: servgrid-minio
    ports:
      - '${SERVGRID_MINIO_API_PORT:-9000}:9000'
      - '${SERVGRID_MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  api:
    # The T0.16 image, same one CI builds and the VPS runs. Profile-gated:
    # the default local flow runs the API on the host against db+minio.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ['full']
    environment:
      # Compose-internal coordinates — the API reaches its dependencies
      # by service name. Credentials come from the root .env, exactly as
      # for the host-run dev API.
      DATABASE_URL: postgres://servgrid:servgrid@db:5432/servgrid
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: servgrid-attachments
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-servgrid}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-servgrid-minio}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-not-a-secret-change-me-on-the-vps}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-{"project_id":"servgrid-local","client_email":"local@servgrid-local.iam.gserviceaccount.com","private_key":"placeholder"}}
      WORK_WINDOW_START: ${WORK_WINDOW_START:-09:00}
      WORK_WINDOW_END: ${WORK_WINDOW_END:-19:00}
      PING_RETENTION_DAYS: ${PING_RETENTION_DAYS:-90}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # node:22-alpine has no curl/wget; fetch() is stdlib.
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    # TLS termination in production; locally the host side is moved off
    # 80/443 (commonly taken on dev machines) and fronts the api service
    # when the `full` profile is up, else answers alone.
    ports:
      - '${SERVGRID_CADDY_HTTP_PORT:-8081}:80'
      # 9443, not 8443: 8443 is a very common default (Mattermost,
      # Portainer, ...) and collides on dev machines that self-host.
      - '${SERVGRID_CADDY_HTTPS_PORT:-9443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  # Named volumes for all state; bind mounts would fight container users.
  db-data:
  minio-data:
  caddy-data:
  caddy-config:
